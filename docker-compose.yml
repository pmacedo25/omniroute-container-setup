name: omniroute-setup

services:
  omniroute:
    image: diegosouzapw/omniroute:${OMNIROUTE_VERSION:-3.8.48}
    container_name: omniroute
    restart: unless-stopped
    stop_grace_period: 40s
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: ${PORT:-20128}
      HOSTNAME: 0.0.0.0
      REQUIRE_API_KEY: "true"
      OMNIROUTE_MEMORY_MB: ${OMNIROUTE_MEMORY_MB:-1024}
    ports:
      - "${PORT:-20128}:${PORT:-20128}"
    volumes:
      - omniroute-data:/app/data
      - omniroute-skills:/app/data/skills:ro
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  skills-sync:
    build:
      context: ./skills-sync
      dockerfile: Dockerfile
    image: omniroute-skills-sync:1
    restart: unless-stopped
    environment:
      OMNIROUTE_SKILLS_REPO: ${OMNIROUTE_SKILLS_REPO}
      OMNIROUTE_SKILLS_BRANCH: ${OMNIROUTE_SKILLS_BRANCH:-main}
      SKILLS_SYNC_INTERVAL_SECONDS: ${SKILLS_SYNC_INTERVAL_SECONDS:-3600}
    volumes:
      - omniroute-skills:/skills

volumes:
  omniroute-data:
    name: omniroute-data
  omniroute-skills:
    name: omniroute-skills
